<!DOCTYPE html>
<html>
	<head>
		<title>Grant Bowers</title>
		<style>
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
			}
			header {
				display: flex;
				flex-flow: row wrap;
				flex-basis: 5rem;
				padding: 0.5rem;
				gap-horizontal: 2rem;
				border-bottom: 1px solid black;
			}
			.title {
				flex: 0 1 8rem;
				font-family: sans-serif;
				margin-left: 1rem;
			}
			h1 {
				font-weight: 400;
				font-size: 2.5rem;
			}
			.description {
				flex: 0 1 32rem;
				font-size: 1.5rem;
				font-family: serif;
				margin-top: auto;
				padding-left: 2rem;
			}
			p {
				margin-top: 0;
			}
			a {
				color: #ef3f1f;
			}
			.img-gallery{
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				grid-template-rows: repeat(2, 1fr);
				height: calc(100vh - 20rem);	
				box-sizing: border-box;	
				padding: 2rem;
			}
			.img {
				display:flex;
				justify-content: center;
				align-items: center;
				min-width: 0;
			}
			.img > img {
				height: 100%;
				max-width: 100%;
				width: auto;
				object-fit: contain;
			}
			@media (max-width: 693px) {
				.description {
					padding-left: 0;
				}
				.title {
					flex: 0 1 16rem;
				}
			    .img-gallery {
			        grid-template-columns: 1fr;
			        grid-template-rows: repeat(4, 1fr);
			    }
			}
		</style>
	</head>
	<body>
		<header>
			<div class='title'>
				<h1>Grant Bowers</h1>
			</div>
			<div class='description'>
				<p>Student type designer. Focused on making beautiful and useful systems of letters. I particularly enjoy text faces and global scripts. <a href='mailto:contact@gbtype.com'>Email me</a>.
			</div>
		</header>
		<main>
			<div class='img-gallery'>
				<div class='img'>
					<img src='img/Liber.svg'>
				</div>
				
				<div class='img'>
					<img src='img/Grendel.svg'>
				</div>
				
				<div class='img'>
					<img src='img/Orange.svg'>
				</div>
				
				<div class='img'>
					<img src='img/Madison.svg'>
				</div>
			</div>
		</main>
	</body>
</html>
